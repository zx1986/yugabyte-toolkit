[project]
name = "yb-csv-importer"
version = "0.1.0"
description = "A standard YugabyteDB CSV import and benchmarking tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "psycopg2-yugabytedb-binary>=2.9.3; sys_platform == 'linux'",
    "psycopg2-binary>=2.9.9; sys_platform == 'darwin'",
    "PyYAML>=6.0",
    "kubernetes>=31.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
