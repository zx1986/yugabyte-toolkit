services:
  yb-node1:
    image: yugabytedb/yugabyte:2024.2.8.0-b85
    container_name: yb-node1
    hostname: yb-node1
    ports:
      - "5433:5433"   # YSQL
      - "7000:7000"   # Master UI
      - "9000:9000"   # TServer UI
    command:
      - bash
      - -c
      - |
        bin/yugabyted start \
          --base_dir=/home/yugabyte/yb_data \
          --advertise_address=yb-node1 \
          --cloud_location=cloud.region.zone1 \
          --fault_tolerance=zone \
          --daemon=false
    volumes:
      - yb_data1:/home/yugabyte/yb_data
    networks:
      - yb-net
    deploy:
      resources:
        limits:
          memory: 2G

  yb-node2:
    image: yugabytedb/yugabyte:2024.2.8.0-b85
    container_name: yb-node2
    hostname: yb-node2
    command:
      - bash
      - -c
      - |
        bin/yugabyted start \
          --base_dir=/home/yugabyte/yb_data \
          --advertise_address=yb-node2 \
          --join=yb-node1 \
          --cloud_location=cloud.region.zone2 \
          --fault_tolerance=zone \
          --daemon=false
    volumes:
      - yb_data2:/home/yugabyte/yb_data
    depends_on:
      - yb-node1
    networks:
      - yb-net
    deploy:
      resources:
        limits:
          memory: 2G

  yb-node3:
    image: yugabytedb/yugabyte:2024.2.8.0-b85
    container_name: yb-node3
    hostname: yb-node3
    command:
      - bash
      - -c
      - |
        bin/yugabyted start \
          --base_dir=/home/yugabyte/yb_data \
          --advertise_address=yb-node3 \
          --join=yb-node1 \
          --cloud_location=cloud.region.zone3 \
          --fault_tolerance=zone \
          --daemon=false
    volumes:
      - yb_data3:/home/yugabyte/yb_data
    depends_on:
      - yb-node1
    networks:
      - yb-net
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  yb-net:
    driver: bridge

volumes:
  yb_data1:
  yb_data2:
  yb_data3:
